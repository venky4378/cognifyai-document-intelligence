spring.application.name=docuai

server.port=8181

#PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/docuai
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

jwt.secret= ${JWT_SECRET}
jwt.expiration=86400000

#File Storage
file.upload-dir=uploads
app.document.storage-dir=uploads-documents
logging.level.org.springframework.security=DEBUG

# Gemini API
spring.ai.google.genai.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.chat.model=gemini-3.8-flash
spring.ai.google.genai.chat.temperature=0.2

# Use Groq for chat / answer generation
spring.ai.model.chat=openai
spring.ai.openai.api-key= ${GROQ_API_KEY}
spring.ai.openai.chat.base-url=https://api.groq.com/openai/v1
spring.ai.openai.chat.model=openai/gpt-oss-20b

spring.ai.google.genai.embedding.api-key=${GOOGLE_GENAI_API_KEY}
spring.ai.google.genai.embedding.text.model=gemini-embedding-001
logging.level.com.google.genai=DEBUG
spring.ai.model.embedding=google-genai

# Spring AI PGvector configuration
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=3072
spring.ai.vectorstore.pgvector.index-type=NONE
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

